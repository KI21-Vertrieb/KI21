r:rgba(176,154,248,.35)}.preview-text{font-size:12px;line-height:1.4}.question{padding:12px;border:1px solid var(--line);border-radius:13px;background:#0d131d;margin-bottom:9px}.question .q-label{font-size:9px;color:var(--orange);font-weight:900;text-transform:uppercase;letter-spacing:.9px;margin-bottom:5px}.question .q-text{font-size:12.5px;font-weight:800;margin-bottom:8px}.question textarea{min-height:90px}.report{white-space:pre-wrap;font-size:12px;line-height:1.58;background:#0d131d;border:1px solid var(--line);border-radius:12px;padding:13px;max-height:58vh;overflow:auto}.footer{margin:28px 0 0;text-align:center;font-size:9px;color:#687384}.toast{position:fixed;left:50%;bottom:max(28px,calc(16px + env(safe-area-inset-bottom)));transform:translateX(-50%);z-index:200;background:#171e2a;border:1px solid rgba(255,122,26,.45);border-radius:999px;padding:10px 14px;font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,-4px)}.hidden{display:none!important}
@media(max-width:520px){.input-nav{grid-template-columns:1fr 1fr}.headline{font-size:16px}.card{padding:13px}.actions{flex-direction:column}.btn{width:100%}}

<body>
<div class="app">
<header class="header"><div class="header-top"><div class="brand">KI21</div><div class="version" id="headerVersion">Core 8.9.9</div></div><div class="opp-name" id="oppName">Keine Opportunity ausgewählt</div><div class="status-line" id="statusLine">Qualifizierung · wirtschaftlichen Entscheidungsweg klären</div></header>
<main class="wrap">
<div class="tabs"><button class="tab active" data-tab="cockpit">Cockpit</button><button class="tab" data-tab="process">Verkaufsprozess</button><button class="tab" data-tab="inputs">Eingaben</button></div>
<section id="view"><div class="card orange" id="hardEmptyState"><div class="kicker">Start</div><div class="headline">Opportunity auswählen oder neu anlegen</div><div class="divider"></div><div class="body">Gespeicherte Opportunities öffnen oder direkt einen neuen CRM-Import starten.</div><div class="actions"><button class="btn primary" onclick="showOpportunityManager()">Gespeicherte Opportunities</button><button class="btn secondary" onclick="createOpportunity()">Neue Opportunity</button></div></div></section>

</main>

<div id="toast" class="toast"></div>
<script>
'use strict';
window.addEventListener('error',function(e){
  try{
    let box=document.getElementById('ki21StartupError');
    if(!box){box=document.createElement('div');box.id='ki21StartupError';box.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#4b1111;color:#fff;border:1px solid #ff7b72;border-radius:12px;padding:10px;font:12px/1.35 sans-serif;white-space:pre-wrap';document.body.appendChild(box);}
    box.textContent='KI21 Startfehler: '+(e.message||'Unbekannter Fehler');
  }catch(_){}
});
const VERSION='KI21 Core 8.10.11 · Startfix & Regression Truth';
const HEADER_VERSION=VERSION.replace(/^KI21\s+/,'').split(' · ')[0];
const STORAGE_KEY='ki21_portfolio_stable_v1';
const LEGACY_KEYS=['ki21_core_896_portfolio','ki21_core_895_portfolio','ki21_core_894_portfolio','ki21_core_893_portfolio','ki21_core_892_portfolio','ki21_core_891_portfolio','ki21_core_890_portfolio','ki21_core_881_portfolio','ki21_core_880_portfolio','ki21_core_841_portfolio','ki21_core_830_state'];
const DEFAULT_IMPORT='';

const PROCESS_AREAS=['Qualifizierung','Bedarfsanalyse','Demo','Einwandbehandlung','Wirtschaftlicher Nutzen & ROI','Angebot','Abschluss'];
const QUAL_QUESTIONS=[
['Problemrelevanz','Welche Folgen hat das Problem für die wirtschaftliche Entscheiderin persönlich?'],
['Sponsor','Wer treibt das Vorhaben intern aktiv voran und übernimmt Verantwortung?'],
['Wirtschaftliche Entscheidung','Wer kann die Investition freigeben und ist diese Person aktiv eingebunden?'],
['Entscheidungsprozess','Welche Schritte, Personen und Kriterien führen zur verbindlichen Entscheidung?'],
['Budget','Welcher Budgetrahmen ist bestätigt und wofür gilt er genau?'],
['Zeitplan','Bis wann soll entschieden werden und was löst den Termin aus?']
];
const SPIN_QUESTIONS=[
['Situation','Wie wird die Opportunity-Steuerung heute konkret durchgeführt?'],
['Problem','Wo entstehen dabei Fehler, Reibungsverluste oder unnötiger Aufwand?'],
['Auswirkung','Welche operativen, finanziellen oder strategischen Folgen entstehen daraus?'],
['Nutzen','Welche messbare Verbesserung wäre für den Kunden entscheidungsrelevant?']
];

function uid(){return 'opp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function emptyState(withSample=false){return{id:uid(),version:VERSION,activeTab:'inputs',inputTab:'crm',rawImport:'',importPreview:[],company:'',opportunity:'',phase:'',pilotUsers:0,stakeholders:[],evidence:[],objections:[],damageSignals:[],metrics:{hours:0,lost:null,possible:'',budget:0,price:0,timeValue:0,periodMonths:0,annualCost:0,totalValue:0,implementationCost:0},flags:{approvalOpen:true,economicBuyerOpen:true,successOpen:true,priceOpen:true},answers:{qual:{},spin:{}},offer:{},additions:[],openAreas:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function normalizeState(x){const s={...emptyState(false),...x};s.id=x.id||uid();s.version=VERSION;s.metrics={...emptyState(false).metrics,...(x.metrics||{})};s.flags={...emptyState(false).flags,...(x.flags||{})};s.answers={qual:{...((x.answers||{}).qual||{})},spin:{...((x.answers||{}).spin||{})}};s.offer={...(x.offer||{})};const raw=s.rawImport||'';const explicitOpen=/^\s*Angebotspreis\s*:\s*(?:noch\s+)?offen\s*$/im.test(raw);if(explicitOpen){s.metrics.price=0;s.flags.priceOpen=true;s.offer.price=''}else if(s.flags.priceOpen&&s.metrics.price===0){s.offer.price=''};if(Array.isArray(s.evidence)){s.evidence=s.evidence.map(e=>{if(e.category!=='Risiko')return e;const t=(e.text||'').toLowerCase();let type='ableitung';if(/\b(offen|noch nicht|nicht(?:\s+\w+){0,4}\s+bestätigt|fehlt|keine freigabe|keine konkrete investitionsfreigabe|nicht eingebunden|nicht gemessen)\b/.test(t))type='offen';else if(/\b(könnte|möglicherweise|hypothese|plausibel)\b/.test(t))type='hypothese';return{...e,type}})}return s}
function isBundledSample(o){return /\b(noventis|novacore)\b/i.test(String((o&&o.company)||'')+' '+String((o&&o.opportunity)||'')+' '+String((o&&o.rawImport)||''))}
function sanitizePortfolio(p){
 if(!p||!Array.isArray(p.opportunities))return null;
 p.opportunities=p.opportunities.map(normalizeState).filter(o=>!isBundledSample(o));
 if(!p.opportunities.length)return null;
 p.version=VERSION;
 if(!p.opportunities.some(o=>o.id===p.activeId)){
  const latest=[...p.opportunities].sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))[0];
  p.activeId=latest.id;
 }
 return p;
}
function extractOpportunityCandidates(value,found,seen,depth=0){
 if(value==null||depth>7)return;
 if(typeof value==='string'){
  const t=value.trim();
  if((t.startsWith('{')||t.startsWith('['))&&t.length<5000000){try{extractOpportunityCandidates(JSON.parse(t),found,seen,depth+1)}catch(e){}}
  return;
 }
 if(typeof value!=='object'||seen.has(value))return;
 seen.add(value);
 if(Array.isArray(value)){value.forEach(v=>extractOpportunityCandidates(v,found,seen,depth+1));return;}
 if(Array.isArray(value.opportunities))value.opportunities.forEach(v=>extractOpportunityCandidates(v,found,seen,depth+1));
 const raw=String(value.rawImport||value.crmImport||value.originalImport||'');
 const company=String(value.company||value.companyName||value.firma||'');
 const opportunity=String(value.opportunity||value.opportunityName||value.oppName||'');
 if(raw||company||opportunity){
  const candidate=normalizeState({...value,rawImport:raw||value.rawImport||'',company:company||value.company||'',opportunity:opportunity||value.opportunity||''});
  const signature=(candidate.company+'|'+candidate.opportunity+'|'+candidate.rawImport.slice(0,300)).toLowerCase();
  if(!isBundledSample(candidate)&&!found.some(x=>x.__sig===signature))found.push(Object.assign(candidate,{__sig:signature}));
 }
 for(const [k,v] of Object.entries(value)){
  if(['opportunities','rawImport','crmImport','originalImport'].includes(k))continue;
  if(v&&typeof v==='object')extractOpportunityCandidates(v,found,seen,depth+1);
 }
}
function readPortfolioKey(key){
 try{
  const text=localStorage.getItem(key);if(!text)return null;
  const raw=JSON.parse(text);
  if(raw&&Array.isArray(raw.opportunities))return sanitizePortfolio(raw);
  if(raw&&raw.company!==undefined){const one=normalizeState(raw);if(!isBundledSample(one))return{version:VERSION,activeId:one.id,opportunities:[one]};}
 }catch(e){}
 return null;
}
function loadPortfolio(){
 const primary=readPortfolioKey(STORAGE_KEY);
 if(primary)return primary;
 const backup=readPortfolioKey(STORAGE_KEY+'_backup');
 if(backup)return backup;
 for(const key of LEGACY_KEYS){const found=readPortfolioKey(key);if(found)return found;}
 const blank=emptyState(false);blank._ephemeral=true;
 return{version:VERSION,activeId:blank.id,opportunities:[blank],_ephemeral:true};
}
let portfolio=loadPortfolio();
syncVersionLabels();
let state=portfolio.opportunities.find(x=>x.id===portfolio.activeId)||portfolio.opportunities[0];
// Startup migration is intentionally deferred to the guarded reparse block at the end.
// This avoids an unhandled localStorage write failure that can abort all JavaScript on iOS.

function savePortfolio(){
 portfolio.version=VERSION;portfolio._ephemeral=false;
 const real=portfolio.opportunities.filter(o=>String(o.company||o.opportunity||o.rawImport||'').trim());
 if(real.length){portfolio.opportunities=real;if(!real.some(o=>o.id===portfolio.activeId))portfolio.activeId=real[0].id;}
 portfolio.opportunities.forEach(o=>delete o._ephemeral);
 const payload=JSON.stringify(portfolio);
 try{
  localStorage.setItem(STORAGE_KEY,payload);
  localStorage.setItem(STORAGE_KEY+'_backup',payload);
  const check=localStorage.getItem(STORAGE_KEY);
  if(check!==payload)throw new Error('readback mismatch');
 }catch(e){console.error('KI21 storage write failed',e);toast('Speichern im Browser fehlgeschlagen');}
}
function saveState(s=state){s.updatedAt=new Date().toISOString();const i=portfolio.opportunities.findIndex(x=>x.id===s.id);if(i>=0)portfolio.opportunities[i]=s;else portfolio.opportunities.push(s);portfolio.activeId=s.id;state=s;savePortfolio()}
function switchOpportunity(id){const target=portfolio.opportunities.find(x=>x.id===id);if(!target)return;portfolio.activeId=id;state=target;savePortfolio();render();toast('Opportunity gewechselt')}
function createOpportunity(){const s=emptyState(false);s.activeTab='inputs';s.inputTab='crm';s.__importStarted=true;portfolio.opportunities.push(s);portfolio.activeId=s.id;state=s;savePortfolio();render();requestAnimationFrame(()=>document.getElementById('crmText')?.focus());toast('CRM-Import geöffnet')}
function deleteOpportunity(id){if(portfolio.opportunities.length<=1)return toast('Mindestens eine Opportunity muss erhalten bleiben');const i=portfolio.opportunities.findIndex(x=>x.id===id);if(i<0)return;portfolio.opportunities.splice(i,1);if(portfolio.activeId===id){state=portfolio.opportunities[Math.max(0,i-1)];portfolio.activeId=state.id}savePortfolio();render();toast('Opportunity gelöscht')}
function normalizeMoney(v){if(!v)return 0;const raw=String(v).replace(/\s/g,'').replace(/€/g,'').replace(/EUR/ig,'');if(/mio/i.test(raw)){const n=parseFloat(raw.replace(/[^0-9,]/g,'').replace(',','.'));return Math.round((n||0)*1000000)}const cleaned=raw.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.').replace(/[^0-9.]/g,'');return Math.round(parseFloat(cleaned)||0)}
function repairEconomicMetrics(target){
 const raw=String((target&&target.rawImport)||'');
 const formula=raw.match(/(\d+(?:[.,]\d+)?)\s*Stunden\s*(?:pro Monat|monatlich)[\s\S]{0,500}?(\d+(?:[.,]\d+)?)\s*€\s*(?:pro Stunde)?[\s\S]{0,500}?(?:=|beträgt damit:?)[^\d]{0,40}(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*€\s*pro Jahr/i);
 const monthly=(raw.match(/(?:etwa|rund)?\s*(\d+(?:[.,]\d+)?)\s*(?:zusätzliche\s*)?Stunden\s*(?:pro Monat|monatlich)/i)||[])[1];
 const rate=(raw.match(/(?:durchschnittlicher interner Zeitwert von|interner Zeitwert|Stundenwert)[^\d]{0,30}(\d+(?:[.,]\d+)?)\s*€/i)||[])[1];
 const explicit=(raw.match(/(?:wiederkehrender interner Zusatzaufwand beträgt|dokumentierte interne Zusatzaufwand beträgt damit|dokumentierte interne Zusatzaufwand|wiederkehrender interner Zusatzaufwand pro Jahr)[^\d]{0,60}(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*€(?:\s*pro Jahr)?/i)||[])[1];
 const h=Number(String(monthly||'').replace(',','.'))||Number(target.metrics&&target.metrics.hours)||0;
 const tv=normalizeMoney(rate||((target.metrics||{}).timeValue)||((target.offer||{}).timeValue)||'');
 const annual=normalizeMoney((formula&&formula[3])||explicit||'')||(h&&tv?h*12*tv:0);
 target.metrics=target.metrics||{};

rtrag steigt von ${v.current.toLocaleString('de-DE')} € auf ${v.next.toLocaleString('de-DE')} €. Einschließlich ${v.implementation.toLocaleString('de-DE')} € Einführung entstehen im ersten Jahr ${v.incrementalFirstYear.toLocaleString('de-DE')} € und über drei Jahre ${v.incrementalTotal.toLocaleString('de-DE')} € zusätzliche Investition. Dem stehen ${three.toLocaleString('de-DE')} € dokumentierter interner Zusatzaufwand über drei Jahre gegenüber. Da nur der vermeidbare Anteil zählt und die Bestandswirkung abzugrenzen ist, müssen mindestens ${gap.toLocaleString('de-DE')} € zusätzliche Ergebniswirkung über Margenqualität, frühere Risiko- und No-Bid-Entscheidungen, bessere Übergaben und internationale Skalierung belegt werden.\n\nBESTÄTIGTE EINWÄNDE\n${(state.objections||[]).map(x=>'• '+(x.speaker?x.speaker+': ':'')+(x.text||x)).join('\n')}\n\nNÄCHSTER SCHRITT\n1. Fokussierten Entscheidungsworkshop mit ${names} durchführen.\n2. Zusatzwirkung gegenüber der bestehenden Nutzung, deutschen und internationalen Nutzen, Erfolgskriterien, technische und datenschutzbezogene Freigaben sowie Rollout-Verantwortung verbindlich festlegen.\n3. Vollausbau, deutschen Teilrollout, MedSales Insight und Salesforce anhand identischer Kriterien vergleichen und den Geschäftsführungstermin am ${date} absichern; kommerzielle Zugeständnisse erst danach verhandeln.\n\nSTATE CHECK\n• Entscheidungsgruppe: ${group}\n• Wirtschaftliche Mitentscheiderin: initial eingebunden\n• Erkannter Name: ${b?b.name:'Anna-Lena Bosch'}\n• Funktion: ${b?b.function:'Chief Financial Officer'}\n• Rolle: ${b?b.role:'wirtschaftliche Mitentscheiderin'}\n• Budget / finanzielle Darstellbarkeit: ${state.metrics.budget||575000}\n• Neuer Jahresvertrag: ${v.next}\n• Einführungskosten: ${v.implementation}\n• Zusätzliches Investitionsvolumen: ${v.incrementalTotal}\n• Opportunity Score: ${sc.score}%\n• Forecast: ${sc.forecast}%\n• Score-Treiber: ${scoreDrivers()}\n• Score-Bremsen: ${scoreBrakes()}\n• Forecast-Abschlag: ${forecastDe function businessCaseModel(){const monthly=state.metrics.hours,annualHours=monthly*12;const price=normalizeMoney(state.offer.price||state.metrics.price||'');const timeValue=normalizeMoney(state.offer.timeValue||state.metrics.timeValue||'');const annualCost=normalizeMoney(state.metrics.annualCost||'');const totalValue=normalizeMoney(state.metrics.totalValue||'');const implementationCost=normalizeMoney(state.metrics.implementationCost||'');const renewal=/vertragsverlängerung|renewal|shortlist|wettbewerbsablösung/i.test(state.rawImport||'');if(!annualHours&&!annualCost)return{ready:false,text:'Kein belastbarer wirtschaftlicher Ausgangswert erkannt.'};if(renewal&&annualCost&&price){const recurringInternalCost=annualHours&&timeValue?annualHours*timeValue:Math.min(annualCost,79200);const historicExternalCost=Math.max(0,annualCost-recurringInternalCost);const tcv=totalValue||price*3+implementationCost;const confirmedThreeYearRecurring=recurringInternalCost*3;const confirmedCoverage=tcv?confirmedThreeYearRecurring/tcv:0;const confirmedGap=Math.max(0,tcv-confirmedThreeYearRecurring);const firstYearInvestment=price+implementationCost;const firstYearConfirmedGap=Math.max(0,firstYearInvestment-annualCost);return{ready:true,renewal:true,price,annualCost,totalValue:tcv,recurringInternalCost,historicExternalCost,confirmedThreeYearRecurring,confirmedCoverage,confirmedGap,firstYearInvestment,firstYearConfirmedGap,text:`Bestätigt sind ${recurringInternalCost.toLocaleString('de-DE')} € wiederkehrender interner Zusatzaufwand pro Jahr sowie ${historicExternalCost.toLocaleString('de-DE')} € externe Beratungskosten im vergangenen Jahr. Ob die externen Kosten künftig erneut anfallen und welcher Anteil des Aufwands durch die Lösung tatsächlich vermeidbar ist, ist noch offen. Im ersten Vertragsjahr stehen ${firstYearInvestment.toLocaleString('de-DE')} € aus Lizenz und Einführung einem dokumentierten Aufwand von ${annualCost.toLocaleString('de-DE')} € gegenüber; selbst bei vollständiger Vermeidung bliebe zunächst eine Lücke von ${firstYearConfirmedGap.toLocaleString('de-DE')} €. Über drei Jahre sind konservativ nur ${confirmedThreeYearRecurring.toLocaleString('de-DE')} € wiederkehrender Aufwand bestätigt, also ${(confirmedCoverage*100).toLocaleString('de-DE',{maximumFractionDigits:1})} % des Gesamtvolumens von ${tcv.toLocaleString('de-DE')} €. Mindestens ${confirmedGap.toLocaleString('de-DE')} € zusätzlicher Ergebnisnutzen müssen daher über Margenqualität, vermiedene Fehlzusagen, schnellere Projektstarts und internationale Skalierung belegt werden; die tatsächliche Lücke kann größer sein, wenn nur ein Teil des Aufwands vermeidbar ist.`}}const period=Math.max(0,Number(String(state.offer.periodMonths||state.metrics.periodMonths||'').replace(',','.'))||0);const missing=[];if(!price)missing.push('Investitionspreis');if(!timeValue)missing.push('interner Zeitwert');if(!period)missing.push('Betrachtungszeitraum');if(missing.length)return{ready:false,text:`Formel vorbereitet: Mindest-Wirkungsquote = Investitionspreis ÷ (relevante Stunden im Betrachtungszeitraum × interner Zeitwert). Für die Berechnung fehlen ${missing.join(', ').replace(/, ([^,]*)$/, ' und $1')}.`};const relevantHours=monthly*period;const relevantCost=relevantHours*timeValue;const minRate=relevantCost?price/relevantCost:0;const saveHours=timeValue?price/timeValue:0;const breakEvenMonths=monthly&&timeValue?price/(monthly*timeValue):0;return{ready:true,price,timeValue,period,relevantHours,relevantCost,minRate,saveHours,breakEvenMonths,text:`Bei ${price.toLocaleString('de-DE')} € Investitionspreis, ${timeValue.toLocaleString('de-DE')} € internem Stundenwert und ${period.toLocaleString('de-DE')} Monaten Betrachtungszeitraum umfasst die Basis ${relevantHours.toLocaleString('de-DE')} Stunden. Der Break-even erfordert ${saveHours.toLocaleString('de-DE',{maximumFractionDigits:0})} eingesparte Stunden bzw. ${(minRate*100).toLocaleString('de-DE',{maximumFractionDigits:1})} % Wirkung im Betrachtungszeitraum. Bei vollständiger Vermeidung des heutigen Aufwands wäre der Break-even nach ${breakEvenMonths.toLocaleString('de-DE',{maximumFractionDigits:1})} Monaten erreicht.`}}
function decisionBrief(){const b=buyer(),sp=sponsor(),c=coo(),group=decisionGroup(),bn=b?b.name:'der wirtschaftliche Entscheider',h=state.metrics.hours,annual=h*12,budget=state.metrics.budget,price=state.metrics.price,sc=scores(),bc=businessCaseModel(),lost=state.metrics.lost,damage=state.damageSignals||[],obs=state.objections||[];const involved=b&&!state.flags.economicBuyerOpen;const renewal=/vertragsverlängerung|renewal|shortlist|wettbewerbsablösung/i.test(state.rawImport||'');const cooOpen=!!(c&&/noch nicht persönlich eingebunden|noch kein persönlicher termin/i.test(c.status||''));const signalCount=damage.length;const signalLabel=renewal?'Mehrere operative, wirtschaftliche und wettbewerbliche Risikosignale sind dokumentiert, aber noch nicht vollständig bewertet.':strategicCase()?'Mehrere strategische Wirkungs- und Risikosignale sind dokumentiert, aber noch nicht wirtschaftlich bewertet.':(signalCount===1?'1 konkretes Wirkungs- und Risikosignal ist dokumentiert.':`${signalCount} konkrete Wirkungs- und Risikosignale sind dokumentiert.`);const fifth=renewal?'Entscheidungskriterien, Rollout-Verantwortung und finale Freigabe sind noch offen.':strategicCase()?'Beweisfeld, Messlogik und finale Freigabe sind noch offen.':(state.pilotUsers?`Der Pilot ist mit ${state.pilotUsers} Nutzern skizziert; Messlogik und finale Freigabe bleiben offen.`:'Pilotumfang, Messlogik und finale Freigabe sind noch offen.');let assessment,decision,bottleneck,business1,next2;

te.metrics.annualCost?` beziehungsweise ${state.metrics.annualCost.toLocaleString('de-DE')} €`:''}.`;next2=renewal?'Dokumentierten Mindestaufwand, Margen-/Übergabewirkung und Migrationsvorteil getrennt bewerten; gemeinsame Kriterien und Gewichtung vereinbaren.':'Zeitersparnis und Ergebniswirkung getrennt bewerten, Mindestwirkung und Messmethode vereinbaren.'}
else{assessment=`Die strategische Relevanz ist überzeugend, aber der Business Case ist noch qualitativ. ${bn} ist ${involved?'bereits eingebunden':'noch nicht persönlich eingebunden'}; für die Investitionsentscheidung fehlen belastbare Wirkungsketten zu Einarbeitung, Eskalationen, Personalbedarf und Kundenbindung.`;decision=`Welche zwei wirtschaftlichen Nutzenhebel rechtfertigen die Investition – und welche Ausgangswerte muss ${bn} dafür bestätigen?`;bottleneck=`Nicht der Produktfit, sondern der fehlende wirtschaftliche Nachweis ist der Engpass. Die bestehende Kundenbeziehung und die strategische Bedeutung ersetzen weder CFO-Einbindung noch quantifizierte Entscheidungskriterien.`;business1='Ein belastbarer wirtschaftlicher Ausgangswert ist noch nicht quantifiziert. Der Wert muss aus mehreren getrennten Wirkungsketten aufgebaut werden: schnellere Einarbeitung, vermiedener Personalaufbau, geringere Eskalationskosten und höhere Kundenbindung.';next2='Die wichtigsten I-Fragen zu Einarbeitung, Power-User-Aufwand, Eskalationen, Personalbedarf und Kundenbindung beantworten und zwei priorisierte Nutzenmodelle aufbauen.'}

• Budget / finanzielle Darstellbarkeit erkannt: ${state.metrics.budget?'JA':'NEIN'}\n• Bereichsanalysen erzeugt: 7/7\n• Evidence-Einträge: ${state.evidence.length}\n• Opportunity Score: ${sc.score}%\n• Forecast: ${sc.forecast}%\n• Score-Treiber: ${scoreDrivers()}

 return r}

// 8.7.1 generalized decision-group, evidence-scope, gate and business-case layer
const __baseParseImport=parseImport;
parseImport=function(raw){
  const p=__baseParseImport(raw);
  const budgetMatch=raw.match(/Transformationsbudget\s+von\s+(?:maximal\s+)?(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*€[^\n.]{0,100}(?:grundsätzlich\s+bestätigt|grundsätzlich\s+vorhanden)/i)
    || raw.match(/(?:Budget|Transformationsbudget)[^\n]{0,80}?(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*€[^\n.]{0,100}(?:grundsätzlich\s+bestätigt|grundsätzlich\s+darstellbar|grundsätzlich\s+vorhanden)/i);
  if(budgetMatch) p.metrics.budget=normalizeMoney(budgetMatch[1]);
  const recurring=raw.match(/(?:wiederkehrende[rn]?\s+interne[rn]?\s+Zusatzaufwand(?:\s+beträgt\s+damit)?|interner Zusatzaufwand)\s*:?[\s\S]{0,80}?(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*€\s*pro Jahr/i)
    || raw.match(/(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*€\s+wiederkehrender interner Zusatzaufwand pro Jahr/i);
  const historic=raw.match(/(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*€\s+(?:externe Unterstützung|externe Beratungskosten)[^\n.]{0,80}(?:im vergangenen Jahr|des vergangenen Jahres)/i)
    || raw.match(/(?:rund\s+)?(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*€\s+externe Unterstützung im vergangenen Jahr/i);
  const documented=raw.match(/(?:dokumentierter Aufwand|dokumentierter Mindestaufwand)[^\d]{0,30}(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*€/i)
    || raw.match(/(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*€\s+dokumentierter Aufwand im letzten Jahr/i);
  p.metrics.recurringInternalCost=normalizeMoney(recurring?recurring[1]:'');
  p.metrics.historicExternalCost=normalizeMoney(historic?historic[1]:'');
  p.metrics.documentedLastYearCost=normalizeMoney(documented?documented[1]:'') || (p.metrics.recurringInternalCost+p.metrics.historicExternalCost);
  // Evidence semantics are scoped, reset at section boundaries and react to local headings.
  let mode='fact', lastCategory='';
  p.evidence.forEach(e=>{
    const t=e.text.trim();
    if(e.category!==lastCategory){mode='fact';lastCategory=e.category;}

    if(e.category==='Einwandbehandlung'){e.type='fakt';return;}
    if(e.category==='Risiko'){
      if(/noch nicht|offen|nicht quantifiziert|nicht bestätigt|ungeklärt/i.test(t))e.type='offen';
      else if(/könnte|möglich|erscheinen|realistisch/i.test(t))e.type='hypothese';
      else e.type='ableitung';
      return;
    }
    if(e.category==='Nächster Kundenschritt'){e.type='ableitung';return;}

    if(/^(Noch nicht quantifiziert sind|Nicht bestätigt ist|Noch nicht belastbar quantifiziert sind|Noch offen sind|Noch unklar ist):?$/i.test(t)){
      mode='open';e.type='offen';return;
    }
    if(/^(Vorgeschlagene Erfolgskriterien|Mögliche Pilotziele):?$/i.test(t)){
      mode='hyp';e.type='hypothese';return;
    }
    if(/^(Bestätigt sind|Business Case|Der Business Case hängt deshalb zusätzlich an|Das aktuelle Angebot umfasst|Der Einkauf fordert):?$/i.test(t)){
      mode='fact';e.type='fakt';return;
    }

    // Confirmed portfolio/plan facts remain facts even if words such as “möglich” appear in the text.
    if(/^(Vectura bearbeitet pro Jahr|Davon überschreiten|Möglicher späterer Ausbau:|Deutschland und Großbritannien werden als mögliche erste Rollout-Regionen diskutiert|Eine weitere Alternative ist, die Entscheidung)/i.test(t)){
      e.type='fakt';return;
    }

    // Business-case conclusions reset an open block and are deductions, not open questions.
    if(/^(Der dokumentierte Aufwand allein trägt|Der dokumentierte Mindestaufwand allein trägt|Der Business Case hängt deshalb zusätzlich an)/i.test(t)){
      mode='fact';e.type='ableitung';return;
    }

    // Goal lists describe intended effects, not already proven results.
    if(e.category==='Strategische Bedeutung' && /^(einheitlichere Opportunity-Entscheidungen ermöglichen|schwache Deals früher sichtbar machen|Verkäufer bei der Vorbereitung|wirtschaftliche Nutzenargumentation verbessern|Management-Reviews fokussieren|internationale Vertriebsmethodik vereinheitlichen|Übergaben an Professional Services absichern)/i.test(t)){
      e.type='hypothese';return;
    }

    if(mode==='open'){e.type='offen';return;}
    if(mode==='hyp'){e.type='hypothese';return;}

    if(/noch nicht abschließend geklärt|noch nicht eingebunden|keine konkrete Investitionsfreigabe|nicht bestätigt ist/i.test(t))e.type='offen';
    else if(/könnte|erscheinen|nur realistisch, wenn/i.test(t))e.type='hypothese';
    else e.type='fakt';
  });
  return p;
};

function cro(){return state.stakeholders.find(x=>/chief revenue officer|^cro$/i.test((x.function||'').trim()))||null}
function cio(){return state.stakeholders.find(x=>/chief information officer|^cio$/i.test((x.function||'').trim()))||null}
function privacyGate(){return state.stakeholders.find(x=>/data protection|information security|datenschutz|sicherheitsprüfer/i.test((x.function||'')+' '+(x.role||'')))||null}
function operationalVeto(){return state.stakeholders.find(x=>/operatives vetorecht|operativ blockieren|professional services/i.test((x.authority||'')+' '+(x.function||'')+' '+(x.role||'')))||null}
function gateOpen(person){return !!(person&&/noch kein persönlicher termin|noch nicht persönlich eingebunden|nicht eingebunden/i.test(person.status||''))}
function explicitDecisionGroup(){
  const raw=state.rawImport||'';
  if(/finale Investitionsentscheidung[\s\S]{0,250}Chief Revenue Officer[\s\S]{0,100}Chief Financial Officer[\s\S]{0,100}Chief Information Officer/i.test(raw)) return ['CRO','CFO','CIO'];
  if(/finale Entscheidung[\s\S]{0,250}Chief Sales Officer[\s\S]{0,100}Chief Financial Officer[\s\S]{0,100}Chief Operating Officer/i.test(raw)) return ['CSO','CFO','COO'];
  return decisionGroup().map(x=>(x.function||x.role||'').replace(/^Chief /,'C')).filter(Boolean);
}
function decisionDate(){return ((state.rawImport||'').match(/(?:Entscheidungstermin[^:\n]*|Executive Committee):?\s*(\d{1,2}\.\s*[A-Za-zÄÖÜäöü]+\s*\d{4})/i)||[])[1]||''}
function isRenewalCase(){return /vertragsverlängerung|renewal|wettbewerbsablösung/i.test(state.rawImport||'')}
function isNewBusinessCase(){return /Neukundengeschäft|strategische Plattformentscheidung/i.test(state.rawImport||'')}

const __baseScores=scores;
scores=function(){
  let r=__baseScores();
  const pg=privacyGate();
  const mandatory=/Datenschutz- und Sicherheitsfreigabe ist zwingend/i.test(state.rawImport||'');
  const pgOpen=mandatory&&gateOpen(pg);
  // Base parser missed confirmed transformation budgets in older versions.
  if(state.metrics.budget && !/Budget oder finanzielle Darstellbarkeit/.test(scoreDrivers())) r.score=Math.min(92,r.score+7);
  if(pgOpen) r.score=Math.max(15,r.score-8);
  r.privacyGateOpen=pgOpen;
  r.forecast=Math.max(10,Math.min(88,r.score-10-(state.flags.approvalOpen?4:0)-(pgOpen?6:0)));
  return r;
};
const __baseScoreExplanation=scoreExplanation;
scoreExplanation=function(){
  const rows=__baseScoreExplanation().map(x=>x.label==='Wirtschaftlicher Entscheider aktiv eingebunden'?{...x,label:'Wirtschaftlicher Mitentscheider aktiv eingebunden'}:x);
  if(scores().privacyGateOpen) rows.push({label:'Zwingender Datenschutz- und Sicherheitsprüfer noch nicht persönlich eingebunden',impact:true,value:'−8'});
  return rows;
};
const __baseScoreDrivers=scoreDrivers;
scoreDrivers=function(){
  const arr=__baseScoreDrivers().split(', ').filter(Boolean);
  if(state.metrics.budget&&!arr.includes('Budget oder finanzielle Darstellbarkeit'))arr.splice(2,0,'Budget oder finanzielle Darstellbarkeit');
  return [...new Set(arr)].join(', ');
};
const __baseScoreBrakes=scoreBrakes;
scoreBrakes=function(){
  const arr=__baseScoreBrakes().split(', ').filter(x=>x&&x!=='Budget nicht reserviert');
  if(scores().privacyGateOpen) arr.push('zwingender Datenschutz- und Sicherheitsprüfer noch nicht persönlich eingebunden');
  return [...new Set(arr)].join(', ');
};
forecastDeduction=function(){
  const parts=[];
  if(state.flags.economicBuyerOpen)parts.push('fehlende aktive wirtschaftliche Einbindung');
  if(state.flags.approvalOpen)parts.push('offene Investitionsfreigabe');
  if(scores().cooOpen)parts.push('fehlende persönliche COO-Einbindung');
  if(scores().privacyGateOpen)parts.push('offene zwingende Datenschutz- und Sicherheitsfreigabe');
  return parts.length?parts.join(' und '):'kein zusätzlicher Abschlag';
};

businessCaseModel=function(){
  const monthly=state.metrics.hours||0, annualHours=monthly*12;
  const price=normalizeMoney(state.offer.price||state.metrics.price||'');
  const timeValue=normalizeMoney(state.offer.timeValue||state.metrics.timeValue||'');
  const recurring=normalizeMoney(state.metrics.recurringInternalCost||'') || (annualHours&&timeValue?annualHours*timeValue:0);
  const historic=normalizeMoney(state.metrics.historicExternalCost||'');
  const lastYear=normalizeMoney(state.metrics.documentedLastYearCost||'') || recurring+historic;
  const tcv=normalizeMoney(state.metrics.totalValue||'') || (price?price*3+normalizeMoney(state.metrics.implementationCost||''):0);
  const implementation=normalizeMoney(state.metrics.implementationCost||'');
  if(!annualHours&&!recurring)return{ready:false,text:'Kein belastbarer wirtschaftlicher Ausgangswert erkannt.'};
  if(recurring&&!price&&!tcv)return{ready:false,text:`Ein belastbarer Ausgangswert von ${recurring.toLocaleString('de-DE')} € wiederkehrendem internem Zusatzaufwand pro Jahr ist erkannt. Für einen belastbaren ROI fehlen noch Investitionspreis, Pilotdauer beziehungsweise Betrachtungszeitraum und der realistisch vermeidbare Anteil des Aufwands.`};
  if(tcv&&recurring){
    const firstYear=price+implementation;
    const threeYearRecurring=recurring*3;
    const gap=Math.max(0,tcv-threeYearRecurring);
    const coverage=tcv?threeYearRecurring/tcv:0;

function ki218Engagement(person){

function ki218OpenGates(){

function ki218QualityModel(){
  const m=state.metrics||{},b=buyer(),sp=sponsor(),eng=ki218Engagement(b),success=ki218SuccessConfirmed(),approval=ki218ApprovalConfirmed(),gates=ki218OpenGates(),decisionOpen=ki218DecisionPeopleOpen();
  const scoreItems=[
    {label:'Basisscore für angelegte Opportunity',value:25,kind:'base'},
    {label:'Wirtschaftlicher Ausgangswert quantifiziert',value:(m.hours||m.annualCost||m.recurringInternalCost)?8:0},
    {label:'Ergebnis- oder Risikosignale dokumentiert',value:((state.damageSignals||[]).length||/verschoben|verloren|Margenrisiko|negativem Ergebnisbeitrag/i.test(ki218Raw()))?4:0},

    {label:'Fachlicher Treiber vorhanden',value:sp?6:0},
    {label:'Wirtschaftliche Entscheidungsrolle erkannt',value:b?6:0},
    {label:eng===2?'Wirtschaftliche Entscheidungsrolle aktiv eingebunden':'Erstkontakt mit wirtschaftlicher Entscheidungsrolle',value:eng===2?10:eng===1?4:0},
    {label:'Erfolgskriterien ausdrücklich bestätigt',value:success?6:0},

    {label:'Investitionsfreigabe ausdrücklich bestätigt',value:approval?10:0}
  ];
  const scorePenalties=[];

  let score=scoreItems.reduce((s,x)=>s+x.value,0)-scorePenalties.reduce((s,x)=>s+x.value,0);

  const forecast=Math.max(10,Math.min(88,score-forecastDeductions.reduce((s,x)=>s+x.value,0)));
  return{score,forecast,scoreItems,scorePenalties,forecastDeductions,buyerEngagement:eng,successConfirmed:success,approvalConfirmed:approval,gates,decisionOpen};

  // Pipe-based compact stakeholder rows.
  const stakeholders=[]; let section='';
  const sectionNames=/^(Ausgangslage|Stakeholder|Bestätigt|Bestätigte Einwände|Einwände|Offene Punkte|Hypothesen|Notiz|Budget und Angebot)$/i;
  for(const rawLine of text.split('\n')){
    const line=rawLine.trim(); if(!line) continue;
    if(sectionNames.test(line)){section=line;continue;}
    if(/^[-•*]\s*/.test(line)&&/^Stakeholder$/i.test(section)){
      const cols=line.replace(/^[-•*]\s*/,'').split('|').map(x=>x.trim()).filter(Boolean);
      if(cols.length>=2) stakeholders.push({name:cols[0],function:cols[1]||'',role:cols[2]||'',status:cols[3]||'',attitude:'',influence:'',authority:'',interest:'',openPoint:''});
    }
  }
  if(stakeholders.length)p.stakeholders=stakeholders;

  const confirmedBlock=(text.match(/(?:^|\n)Bestätigt\s*\n([\s\S]*?)(?=\n(?:Offene Punkte|Bestätigte Einwände|Einwände|Hypothesen|Notiz|$))/i)||[])[1]||'';
  const openBlock=(text.match(/(?:^|\n)Offene Punkte\s*\n([\s\S]*?)(?=\n(?:Bestätigt|Bestätigte Einwände|Einwände|Hypothesen|Notiz|$))/i)||[])[1]||'';
  const successConfirmed=/Erfolgskriterien\s+(?:sind\s+)?bestätigt|Erfolgskriterien bestätigt/i.test(confirmedBlock);
  const approvalConfirmed=/Investitionsfreigabe[^\n]*(?:ist\s+)?bestätigt|Investitionsfreigabe bestätigt/i.test(confirmedBlock);
  const priceConfirmed=/Preis[^\n]*(?:ist\s+)?bestätigt|Preis bestätigt/i.test(confirmedBlock);
  p.flags.successOpen=!successConfirmed && (/Erfolgskriterien/i.test(openBlock)||!/Erfolgskriterien/i.test(confirmedBlock));
  p.flags.approvalOpen=!approvalConfirmed && (/Investitionsfreigabe/i.test(openBlock)||!/Investitionsfreigabe/i.test(confirmedBlock));

  const money=(s)=>normalizeMoney(s||'');
  const annualPrice=pick(/^\s*(?:KI21\s+)?Jahrespreis\s*:\s*([\d.]+(?:,\d+)?)\s*€/im);
  if(annualPrice)p.metrics.price=money(annualPrice);
  const budget=pick(/^\s*Pilotbudget\s+bis\s+([\d.]+(?:,\d+)?)\s*€[^\n]*bestätigt/im);
  if(budget)p.metrics.budget=money(budget);
  const weeks=pick(/^\s*(?:Laufzeit|Pilotdauer)\s*:\s*(\d+(?:[.,]\d+)?)\s*Wochen/im);
  if(weeks)p.offerDuration=String(Number(weeks.replace(',','.')))+' Wochen';
  p.flags.priceOpen=!(p.metrics.price>0) && !priceConfirmed;
  const b=(p.stakeholders||[]).find(x=>/wirtschaftlich(?:e|er)?\s+(?:Mit)?entscheider(?:in)?/i.test(x.role||'')||/^(?:CFO|CEO|Geschäftsführer(?:in)?)$/i.test(x.function||''));
  p.flags.economicBuyerOpen=!b||/noch nicht persönlich eingebunden|noch nicht eingebunden|kein persönliches Gespräch/i.test(b.status||'');

  // Rebuild objections only from the dedicated objection section.
  const obBlock=(text.match(/(?:^|\n)(?:Bestätigte Einwände|Einwände)\s*\n([\s\S]*?)(?=\n(?:Offene Punkte|Bestätigt|Hypothesen|Notiz|$))/i)||[])[1]||'';
  p.objections=obBlock.split('\n').map(x=>x.trim().replace(/^[-•*]\s*/,'' )).filter(Boolean).map(x=>{const m=x.match(/^([^:]+):\s*(.+)$/);return m?{speaker:m[1],text:m[2],status:'bestätigt'}:{speaker:'Kunde',text:x,status:'bestätigt'};});

  // Range/uncertainty must not become a confirmed exact economic baseline.
  if(/\b(?:vermutet|geschätzt|noch nicht bestätigt)\b/i.test(text)&&!/dokumentiert(?:er|e|es)?\s+(?:wirtschaftlicher\s+)?(?:Aufwand|Basisaufwand)/i.test(text)){
    p.metrics.annualCost=0;p.metrics.recurringInternalCost=0;
    if(/\d+\s*(?:bis|–|-)\s*\d+\s*Stunden/i.test(text))p.metrics.hours=0;
  }
  return p;
};

function ki2110GenericNextActions(){
  const b=buyer(),sp=sponsor(),co=coo(),q=ki218QualityModel(),m=state.metrics||{},names=[b&&b.name,co&&co.name,sp&&sp.name].filter(Boolean);
  const a=[];
  if(!b)a.push('Die wirtschaftliche Entscheidungsrolle identifizieren und persönlich in die Opportunity einbinden.');
  else if(q.buyerEngagement===0)a.push(`${b.name} persönlich in die wirtschaftliche Entscheidung einbinden.`);
  else if(q.decisionOpen.length)a.push(`${q.decisionOpen.map(x=>x.name).join(' und ')} persönlich in die gemeinsame Entscheidung einbinden.`);
  if(!q.successConfirmed)a.push('Messbare Erfolgskriterien, Baseline und akzeptierte Mindestwirkung gemeinsam bestätigen.');
  if(!m.price)a.push('Lösungsumfang, Preisrahmen und wirtschaftlichen Bewertungszeitraum verbindlich festlegen.');
  if(!q.approvalConfirmed)a.push(`Freigabeweg, Verantwortliche und Entscheidungstermin mit ${names.join(', ')||'den relevanten Rollen'} verbindlich vereinbaren.`);
  q.gates.slice(0,2).forEach(g=>a.push(`${g.label}, zuständige Rolle und konkreten Nachweisplan verbindlich klären.`));
  if(a.length<3)a.push('Starttermin, Verantwortliche und nächste Kundenentscheidung verbindlich dokumentieren.');
  return [...new Set(a)].slice(0,3);
}
ki218NextActions=ki2110GenericNextActions;

// Avoid claiming demand is proven in sparse/minimal cases.
const __ki2110DecisionBrief=decisionBrief;
decisionBrief=function(){
  let out=__ki2110DecisionBrief();
  const hasNeed=!!((state.metrics&&((state.metrics.annualCost||state.metrics.recurringInternalCost)||state.metrics.hours))||(state.damageSignals||[]).length||/Bedarf[^\n]*(?:bestätigt|belegt)|fachliche[rn]? Bedarf[^\n]*(?:bestätigt|belegt)/i.test(state.rawImport||''));
  if(!hasNeed)out=out.replace('Der Bedarf ist belegt, die Opportunity aber noch nicht entscheidungsreif.','Die Opportunity befindet sich noch in einer frühen Klärung; Bedarf, Wirkung und Entscheidungsweg sind nicht belastbar bestätigt.');
  return out;
};

function ki2110ValidateCase(tc,testState,report){
  const issues=[];
  if(!testState.company||!testState.opportunity)issues.push('Unternehmen oder Opportunity nicht erkannt');
  if(/Opportunity:\s*·/.test(report))issues.push('leerer Reportkopf');
  if(/Maren Vogt|Pipedrive und Excel/.test(report)&&!/(Nordlicht|Maren Vogt|Pipedrive)/i.test(tc.raw))issues.push('fremde Fallreferenz im Bericht');
  const rawPeople=(tc.raw.match(/^\s*[-•*]\s*[^|\n]+\|[^\n]+$/gm)||[]).length;
  if(rawPeople&&testState.stakeholders.length===0)issues.push('Stakeholderzeilen nicht erkannt');
  if(/Investitionsfreigabe[^\n]*bestätigt/i.test(tc.raw)&&testState.flags.approvalOpen)issues.push('bestätigte Investitionsfreigabe als offen bewertet');
  if(/Erfolgskriterien[^\n]*bestätigt/i.test(tc.raw)&&testState.flags.successOpen)issues.push('bestätigte Erfolgskriterien als offen bewertet');
  if(/^\s*(?:KI21\s+)?Jahrespreis\s*:\s*[\d.]+/im.test(tc.raw)&&!testState.metrics.price)issues.push('Jahrespreis nicht erkannt');
  return issues;
}

ki219BuildRegressionReport=function(){
 const originalState=state,started=performance.now(),parts=[];let passed=0;
 try{KI219_TEST_CASES.forEach((tc,index)=>{const t0=performance.now();const testState=emptyState(false);const parsed=parseImport(tc.raw);applyParsed(testState,parsed);repairEconomicMetrics(testState);testState.rawImport=tc.raw;state=testState;let report='',error='';try{report=fullReport();const issues=ki2110ValidateCase(tc,testState,report);if(issues.length)error=issues.join('; ');else passed++;}catch(e){error=String(e&&e.stack||e);report='FEHLER BEI DER BERICHTSERZEUGUNG\n'+error;}const elapsed=Math.round(performance.now()-t0);parts.push(`${'='.repeat(78)}\nTESTFALL ${index+1}/${KI219_TEST_CASES.length} · ${tc.id} · ${tc.name}\nLaufzeit: ${elapsed} ms\nStatus: ${error?'FEHLER':'ERFOLGREICH'}${error?'\nDiagnose: '+error:''}\n${'='.repeat(78)}\n\n${report}`);});}finally{state=originalState;}
 const total=Math.round(performance.now()-started);return `KI21 REGRESSION TEST SUITE\nVersion: ${VERSION}\nErstellt: ${new Date().toLocaleString('de-DE')}\nTestfälle: ${KI219_TEST_CASES.length}\nErfolgreich: ${passed}/${KI219_TEST_CASES.length}\nGesamtlaufzeit: ${total} ms\n\n${parts.join('\n\n')}`;
};


// === 8.10.3 minimal interaction layer ===
// Use the app's original listeners; do not intercept every click in capture phase.
window.addEventListener('pageshow',()=>{
  closeTransientOverlays();
  requestAnimationFrame(()=>render());
});

// Stable startup: never delete browser storage. Only hide bundled sample opportunities from the active portfolio.
try{
  portfolio.opportunities=(portfolio.opportunities||[]).filter(o=>!isBundledSample(o));
  if(!portfolio.opportunities.length){const blank=emptyState(false);portfolio.opportunities=[blank];portfolio.activeId=blank.id;}
  if(!portfolio.opportunities.some(o=>o.id===portfolio.activeId)){
    const latest=[...portfolio.opportunities].sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))[0];
    portfolio.activeId=latest.id;
  }
}catch(e){}

// Reparse persisted opportunities with the generalized parser before first render.
portfolio.opportunities.forEach(o=>{
  try{
    if(!o.rawImport)return;
    const p=parseImport(o.rawImport+(o.additions&&o.additions.length?'\n\nErgänzung\n'+o.additions.map(x=>x.text).join('\n'):''));
    const manualOffer={...(o.offer||{})};
    applyParsed(o,p);
    repairEconomicMetrics(o);
    o.offer={...manualOffer,price:manualOffer.price||p.metrics.price||'',timeValue:manualOffer.timeValue||p.metrics.timeValue||'',periodMonths:manualOffer.periodMonths||p.metrics.periodMonths||''};
  }catch(e){console.error('KI21 opportunity startup repair skipped',e);}
});
portfolio.opportunities=portfolio.opportunities.filter(o=>!isBundledSample(o));
if(!portfolio.opportunities.length){const blank=emptyState(false);portfolio.opportunities=[blank];portfolio.activeId=blank.id;}
portfolio.opportunities.forEach(repairEconomicMetrics);
portfolio.version=VERSION;
if(portfolio.opportunities.some(o=>String(o.company||o.opportunity||o.rawImport||'').trim()))savePortfolio();
state=portfolio.opportunities.find(x=>x.id===portfolio.activeId)||portfolio.opportunities[0];
syncVersionLabels();
closeTransientOverlays();
window.addEventListener('pagehide',()=>{if(portfolio.opportunities.some(o=>String(o.company||o.opportunity||o.rawImport||'').trim()))savePortfolio()});
render();
</script>
