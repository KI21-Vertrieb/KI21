<script>
const PATCH="<script id=\"ki21-28-0-2-intelligence-single-source-of-truth\">\n(function(){\n'use strict';\n\nvar RELEASE={\n  version:'28.0.2',\n  short:'Core 28.0.2',\n  full:'KI21 Core 28.0.2 \u00b7 Sales Intelligence Cockpit \u00b7 Intelligence Single Source of Truth'\n};\n\nfunction clean(v){return String(v==null?'':v).replace(/\\s+/g,' ').trim();}\nfunction escRx(v){return String(v||'').replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&');}\nfunction stripNetwork(r){\n  return String(r||'').replace(/\\n?=== KI21 INTELLIGENCE NETWORK \u00b7 SHADOW MODE ===[\\s\\S]*?(?=\\n=== [^=\\n]+ ===|$)/g,'\\n');\n}\nfunction section(r,title){\n  var rx=new RegExp('===\\\\s*'+escRx(title)+'\\\\s*===\\\\s*([\\\\s\\\\S]*?)(?=\\\\n===\\\\s*[^=\\\\n]+\\\\s*===|$)','i');\n  var m=String(r||'').match(rx);\n  return m?m[1].trim():'';\n}\nfunction firstMatch(text,patterns){\n  for(var i=0;i<patterns.length;i++){\n    var m=String(text||'').match(patterns[i]);\n    if(m&&clean(m[1]))return clean(m[1]);\n  }\n  return '';\n}\nfunction numMatch(text,patterns){\n  var v=firstMatch(text,patterns);\n  return v?Number(String(v).replace(',','.')):0;\n}\nfunction euroValue(text,patterns){\n  return firstMatch(text,patterns).replace(/\\s*\u20ac\\s*$/,'').trim();\n}\nfunction euroDisplay(v){\n  if(!v)return '';\n  return /\\\u20ac$/.test(v)?v:(v+' \u20ac');\n}\nfunction clone(v){\n  try{return JSON.parse(JSON.stringify(v));}catch(_e){return v;}\n}\n\nfunction canonicalSnapshot(coreReport){\n  var r=String(coreReport||'');\n  var brief=section(r,'SALES DECISION BRIEF');\n  var stateCheck=section(r,'STATE CHECK');\n  var spiced=section(r,'SPICED DEAL INTELLIGENCE');\n  var mgmt=section(r,'MANAGEMENT-PERSPEKTIVEN');\n  var evidence=section(r,'EVIDENZ-INTEGRIT\u00c4T');\n  var qdiag=section(r,'QUALIT\u00c4TS-KURZDIAGNOSE');\n  var synthesis=section(r,'DEAL STRATEGY SYNTHESIS \u00b7 READ-ONLY');\n  var buying=section(r,'BUYING CENTER');\n\n  var snap={\n    dealType:firstMatch(stateCheck,[\n      /\u2022\\s*Deal-Typ:\\s*([^\\n]+)/i\n    ]) || firstMatch(qdiag,[/\u2022\\s*Deal-Typ:\\s*([^\\n]+)/i]),\n    score:numMatch(stateCheck,[\n      /\u2022\\s*Opportunity Score:\\s*(\\d+(?:[.,]\\d+)?)\\s*%/i\n    ]) || numMatch(qdiag,[/\u2022\\s*Opportunity Score:\\s*(\\d+(?:[.,]\\d+)?)\\s*%/i]),\n    forecast:numMatch(stateCheck,[\n      /\u2022\\s*Forecast:\\s*(\\d+(?:[.,]\\d+)?)\\s*%/i\n    ]),\n    people:numMatch(stateCheck,[\n      /\u2022\\s*Erkannte Personen:\\s*(\\d+)/i\n    ]) || numMatch(evidence,[/\u2022\\s*Erkannte Personen:\\s*(\\d+)/i]),\n    economicBuyer:firstMatch(stateCheck,[\n      /\u2022\\s*Wirtschaftliche Entscheidungsrolle:\\s*([^\\n]+)/i\n    ]) || firstMatch(mgmt,[/\u2022\\s*Wirtschaftliche Entscheidung:\\s*([^.\\n]+)/i]),\n    champion:firstMatch(synthesis,[\n      /\u2022\\s*Interner Treiber\\s*\\/\\s*Champion:\\s*([^\u00b7\\n]+)/i,\n      /\u2022\\s*Interner Treiber\\s*\\/\\s*Champion:\\s*([^\\n]+)/i\n    ]) || firstMatch(mgmt,[\n      /\u2022\\s*Interner Treiber:\\s*(.+?)\\s+ist\\s+aus\\s+der\\s+aktiven\\s+Evidenz/i,\n      /\u2022\\s*Interner Treiber:\\s*(.+?)(?:\\s+zeigt\\s+|\\s+treibt\\s+|$)/i\n    ]),\n    annual:euroValue(evidence,[\n      /\u2022\\s*Quantifizierter wirtschaftlicher Ausgangswert:\\s*([0-9][0-9.\\s]*(?:,[0-9]+)?\\s*\u20ac)/i\n    ]) || euroValue(brief,[\n      /\u2022\\s*Dokumentierter wirtschaftlicher Ausgangswert:\\s*([0-9][0-9.\\s]*(?:,[0-9]+)?\\s*\u20ac)/i\n    ]),\n    budget:euroValue(stateCheck,[\n      /\u2022\\s*Budget:\\s*([0-9][0-9.\\s]*(?:,[0-9]+)?\\s*\u20ac)/i\n    ]) || euroValue(brief,[\n      /\u2022\\s*Budgetrahmen:\\s*([0-9][0-9.\\s]*(?:,[0-9]+)?\\s*\u20ac)/i\n    ]),\n    price:euroValue(stateCheck,[\n      /\u2022\\s*Preis:\\s*([0-9][0-9.\\s]*(?:,[0-9]+)?\\s*\u20ac)/i\n    ]) || euroValue(brief,[\n      /\u2022\\s*Preis\\s*\\/\\s*Investition:\\s*([0-9][0-9.\\s]*(?:,[0-9]+)?\\s*\u20ac)/i\n    ]),\n    critical:firstMatch(spiced,[\n      /\u2022\\s*Critical Event:\\s*(?:BEST\u00c4TIGT|TEILWEISE|OFFEN)\\s*\u00b7\\s*([^\\n]+)/i\n    ]),\n    objections:numMatch(evidence,[\n      /\u2022\\s*Best\u00e4tigte Einw\u00e4nde:\\s*(\\d+)/i\n    ]),\n    blockers:numMatch(evidence,[\n      /\u2022\\s*Best\u00e4tigte Vertragsblocker:\\s*(\\d+)/i\n    ])\n  };\n\n  if(!snap.critical){\n    snap.critical=firstMatch(r,[\n      /Ein kritischer Termin ist dokumentiert:\\s*([^.\\n]+)/i,\n      /Critical Event:\\s*([0-9]{1,2}\\.\\s*[A-Za-z\u00c4\u00d6\u00dc\u00e4\u00f6\u00fc\u00df]+\\s*[0-9]{4})/i\n    ]);\n  }\n  if(!snap.forecast){\n    snap.forecast=numMatch(brief,[/Opportunity Score:\\s*\\d+(?:[.,]\\d+)?%\\s*\u00b7\\s*Forecast:\\s*(\\d+(?:[.,]\\d+)?)%/i]);\n  }\n  if(!snap.score){\n    snap.score=numMatch(brief,[/Opportunity Score:\\s*(\\d+(?:[.,]\\d+)?)%/i]);\n  }\n\n  return Object.freeze(snap);\n}\n\nfunction evidence(value,source,confidence){\n  return {kind:'BEFUND',value:value,source:source||'',confidence:confidence||'HOCH'};\n}\nfunction hypothesis(text,source,confidence){\n  return {kind:'HYPOTHESE',text:text,source:source||'',confidence:confidence||'MITTEL'};\n}\nfunction moduleText(mod){\n  var out=['--- '+mod.name+' ---','Status: '+mod.status];\n  (mod.findings||[]).forEach(function(x){\n    out.push('\u2022 BEFUND \u00b7 '+x.value+(x.source?' \u00b7 Quelle: '+x.source:'')+(x.confidence?' \u00b7 Sicherheit: '+x.confidence:''));\n  });\n  (mod.hypotheses||[]).slice(0,3).forEach(function(x){\n    out.push('\u2022 HYPOTHESE \u00b7 '+x.text+(x.source?' \u00b7 Herkunft: '+x.source:'')+(x.confidence?' \u00b7 Sicherheit: '+x.confidence:''));\n  });\n  (mod.questions||[]).slice(0,3).forEach(function(x){\n    out.push('\u2022 VALIDIERUNGSFRAGE \u00b7 '+x);\n  });\n  return out.join('\\n');\n}\n\nfunction oldNetwork(){\n  try{\n    var n=window.KI21_INTELLIGENCE_NETWORK_2800;\n    if(n&&typeof n.buildNetwork==='function')return clone(n.buildNetwork())||{};\n  }catch(_e){}\n  return {modules:[]};\n}\nfunction getModule(base,name,status){\n  var mods=(base&&Array.isArray(base.modules))?base.modules:[];\n  var found=mods.find(function(x){return x&&x.name===name;});\n  return found?clone(found):{name:name,status:status||'SHADOW',findings:[],hypotheses:[],questions:[]};\n}\nfunction setFindings(mod,findings){\n  mod.findings=findings;\n  return mod;\n}\n\nfunction buildFromSnapshot(snap){\n  var base=oldNetwork();\n  var modules=[];\n\n  var sales=setFindings(getModule(base,'Sales Intelligence','AKTIV'),[\n    evidence('Dominante Deal-Logik: '+(snap.dealType||'nicht erkannt'),'Finaler Core-Snapshot'),\n    evidence('Opportunity Score / Forecast: '+snap.score+'% / '+snap.forecast+'%','Finaler Core-Snapshot')\n  ]);\n  modules.push(sales);\n\n  var decision=setFindings(getModule(base,'Decision Intelligence','AKTIV'),[\n    evidence(snap.economicBuyer?'Wirtschaftliche Entscheidungsrolle erkannt: '+snap.economicBuyer:'Wirtschaftliche Entscheidungsrolle noch nicht belastbar best\u00e4tigt','Finaler Core-Snapshot'),\n    evidence(snap.critical?'Critical Event: '+snap.critical:'Kein belastbares Critical Event erkannt','Finaler Core-Snapshot')\n  ]);\n  modules.push(decision);\n\n  var buying=setFindings(getModule(base,'Buying Center Intelligence','AKTIV'),[\n    evidence('Erkannte Personen: '+snap.people,'Finaler Core-Snapshot'),\n    evidence(snap.champion?'Interne Tr\u00e4gerschaft/Champion: '+snap.champion:'Kein best\u00e4tigter Champion aus aktiver Evidenz ableitbar','Finaler Core-Snapshot')\n  ]);\n  modules.push(buying);\n\n  var bc=setFindings(getModule(base,'Business Case Intelligence','AKTIV'),[\n    evidence(snap.annual?'Dokumentierter wirtschaftlicher Ausgangswert: '+euroDisplay(snap.annual):'Kein belastbarer wirtschaftlicher Ausgangswert erkannt','Finaler Core-Snapshot'),\n    evidence(snap.price?'Preis / Investition: '+euroDisplay(snap.price):'Preis / Investition nicht belastbar erkannt','Finaler Core-Snapshot'),\n    evidence(snap.budget?'Budgetrahmen: '+euroDisplay(snap.budget):'Budget nicht belastbar best\u00e4tigt','Finaler Core-Snapshot')\n  ]);\n  modules.push(bc);\n\n  var neg=setFindings(getModule(base,'Negotiation Intelligence','AKTIV'),[\n    evidence('Best\u00e4tigte Vertragsblocker: '+snap.blockers,'Finaler Core-Snapshot'),\n    evidence('Best\u00e4tigte Einw\u00e4nde: '+snap.objections,'Finaler Core-Snapshot')\n  ]);\n  modules.push(neg);\n\n  var gap=Math.max(0,Number(snap.score||0)-Number(snap.forecast||0));\n  var risk=setFindings(getModule(base,'Risk Intelligence','AKTIV'),[\n    evidence('Score-Forecast-Abstand: '+gap+' Prozentpunkte','Finaler Core-Snapshot'),\n    evidence(snap.critical?'Zeitliche Verbindlichkeit vorhanden':'Zeitliche Verbindlichkeit noch offen','Finaler Core-Snapshot')\n  ]);\n  if(Array.isArray(risk.hypotheses)&&risk.hypotheses.length){\n    risk.hypotheses[0]=hypothesis(\n      gap>=15\n        ?'Die Deal-Qualit\u00e4t liegt deutlich \u00fcber der Abschlussn\u00e4he; Entscheidungs- oder Timing-Risiken verdienen besondere Aufmerksamkeit.'\n        :'Score und Forecast zeigen aktuell keinen au\u00dfergew\u00f6hnlich gro\u00dfen Abstand.',\n      'Risk Intelligence','MITTEL'\n    );\n  }\n  modules.push(risk);\n\n  [\n    'Change Intelligence','Industry Intelligence','Consensus Intelligence',\n    'Competitive Intelligence','Customer / External Intelligence'\n  ].forEach(function(name){modules.push(getModule(base,name,name==='Change Intelligence'?'SHADOW':'SHADOW'));});\n\n  return {snapshot:snap,modules:modules};\n}\n\nfunction networkSection(snap){\n  var n=buildFromSnapshot(snap);\n  var lines=[\n    '=== KI21 INTELLIGENCE NETWORK \u00b7 SHADOW MODE ===',\n    '\u2022 Architekturstatus: READ-ONLY \u00b7 keine Mutation von Parser, Deal-State, Score oder Forecast.',\n    '\u2022 Intelligence State Source: FINALER CORE-SNAPSHOT \u00b7 Single Source of Truth.',\n    '\u2022 Externe Live-Recherche: NOCH NICHT AKTIV.',\n    '\u2022 Zweck: zus\u00e4tzliche Hypothesen, Fragen, Risiken und Kontext liefern, ohne best\u00e4tigte Kundenevidenz zu \u00fcberschreiben.',\n    '',\n    'EVIDENZ-LEITPLANKEN',\n    '\u2022 KUNDENEVIDENZ: darf den Core tragen, sofern im aktiven Opportunity-State best\u00e4tigt.',\n    '\u2022 EXTERNE EVIDENZ: k\u00fcnftig nur mit Quelle, Aktualit\u00e4t und Opportunity-Relevanz.',\n    '\u2022 BRANCHENWISSEN: Hypothese / Kontext, keine Kundentatsache.',\n    '\u2022 ANBIETER-/REFERENZWISSEN: Hypothese / Beweisidee, keine Kundentatsache.',\n    '\u2022 LLM-HYPOTHESE: im aktuellen Offline-Shadow-Mode nicht aktiv.',\n    ''\n  ];\n  n.modules.forEach(function(m){lines.push(moduleText(m),'');});\n  lines.push(\n    'INTELLIGENCE-SICHERHEIT',\n    '\u2022 Einfluss auf Opportunity Score: NEIN.',\n    '\u2022 Einfluss auf Forecast: NEIN.',\n    '\u2022 Einfluss auf Deal-DNA: NEIN.',\n    '\u2022 Automatische \u00dcbernahme externer Signale in Kundenevidenz: NEIN.',\n    '\u2022 Core bleibt alleinige Bewertungsinstanz: JA.'\n  );\n  return lines.join('\\n').trim();\n}\n\nfunction injectNetwork(coreReport,snap){\n  var r=stripNetwork(coreReport);\n  var block=networkSection(snap);\n  var marker='=== DEAL-DNA 2.0 ===';\n  var at=r.indexOf(marker);\n  if(at<0){marker='=== EVIDENZ-INTEGRIT\u00c4T ===';at=r.indexOf(marker);}\n  if(at>=0)return (r.slice(0,at)+block+'\\n\\n'+r.slice(at)).replace(/\\n{4,}/g,'\\n\\n\\n').trim();\n  return (r+'\\n\\n'+block).trim();\n}\n\nfunction integrity(snap,networkText){\n  var n=String(networkText||'');\n  var expected=[\n    'Dominante Deal-Logik: '+(snap.dealType||'nicht erkannt'),\n    'Opportunity Score / Forecast: '+snap.score+'% / '+snap.forecast+'%',\n    'Erkannte Personen: '+snap.people,\n    snap.economicBuyer?'Wirtschaftliche Entscheidungsrolle erkannt: '+snap.economicBuyer:'Wirtschaftliche Entscheidungsrolle noch nicht belastbar best\u00e4tigt',\n    snap.champion?'Interne Tr\u00e4gerschaft/Champion: '+snap.champion:'Kein best\u00e4tigter Champion aus aktiver Evidenz ableitbar',\n    snap.annual?'Dokumentierter wirtschaftlicher Ausgangswert: '+euroDisplay(snap.annual):'Kein belastbarer wirtschaftlicher Ausgangswert erkannt',\n    snap.price?'Preis / Investition: '+euroDisplay(snap.price):'Preis / Investition nicht belastbar erkannt',\n    snap.budget?'Budgetrahmen: '+euroDisplay(snap.budget):'Budget nicht belastbar best\u00e4tigt',\n    snap.critical?'Critical Event: '+snap.critical:'Kein belastbares Critical Event erkannt',\n    'Best\u00e4tigte Vertragsblocker: '+snap.blockers,\n    'Best\u00e4tigte Einw\u00e4nde: '+snap.objections,\n    'Score-Forecast-Abstand: '+Math.max(0,Number(snap.score||0)-Number(snap.forecast||0))+' Prozentpunkte',\n    snap.critical?'Zeitliche Verbindlichkeit vorhanden':'Zeitliche Verbindlichkeit noch offen'\n  ];\n  var failed=expected.filter(function(x){return n.indexOf(x)<0;});\n  return {passed:failed.length===0,total:expected.length,passedCount:expected.length-failed.length,failed:failed};\n}\n\nfunction applyQA(report,snap){\n  var r=String(report||'');\n  var qa=integrity(snap,r);\n  var evo='\u2022 Cross-Layer State Integrity: '+(qa.passed?'BESTANDEN':'NICHT BESTANDEN')+\n          ' \u00b7 '+qa.passedCount+'/'+qa.total+' Kernfelder gebunden.';\n  var final='\u2022 Intelligence/Core-Abweichungen: '+(qa.passed?'0':'mindestens '+qa.failed.length)+\n            '\\n\u2022 Intelligence Single Source of Truth: '+(qa.passed?'JA':'NEIN');\n\n  r=r.replace(/(=== INTELLIGENCE-EVOLUTION-CHECK ===\\s*)/i,'$1\\n'+evo+'\\n');\n  r=r.replace(/(=== FINAL-PRODUKT-CHECK ===\\s*)/i,'$1\\n'+final+'\\n');\n\n  if(!qa.passed){\n    r=r.replace(/Pr\u00e4sentationsstatus:\\s*FINAL FREIGEGEBEN/gi,\n      'Pr\u00e4sentationsstatus: GESPERRT \u2013 Cross-Layer State Integrity nicht bestanden');\n  }\n  return r;\n}\n\nvar previousReport=window.fullReport||window.report;\nif(typeof previousReport==='function'){\n  var wrapped=function(){\n    var raw=previousReport.apply(this,arguments);\n    var core=stripNetwork(String(raw||''));\n    var snap=canonicalSnapshot(core);\n    window.KI21_ACTIVE_OPPORTUNITY_SNAPSHOT_2802=snap;\n    var out=injectNetwork(core,snap);\n    out=applyQA(out,snap);\n    out=out.replace(/KI21 Core 28\\.0\\.1 \u00b7 Sales Intelligence Cockpit \u00b7 Intelligence State Binding Fix/g,RELEASE.full);\n    out=out.replace(/Core 28\\.0\\.1/g,RELEASE.short);\n    return out;\n  };\n  wrapped.__ki21_2802=true;\n  window.fullReport=fullReport=wrapped;\n  window.report=wrapped;\n}\n\nwindow.KI21_INTELLIGENCE_SSoT_2802={\n  version:RELEASE.full,\n  invariant:'Alle Intelligence-Kernbefunde lesen ausschlie\u00dflich den finalen Core-Snapshot derselben aktiven Opportunity.',\n  source:'FINAL_CORE_REPORT_SNAPSHOT',\n  safety:{\n    parserMutation:false,stateMutation:false,scoreMutation:false,forecastMutation:false,\n    dealDnaMutation:false,storageMutation:false,webCalls:false,llmCalls:false\n  },\n  snapshot:function(){\n    try{\n      var raw=(typeof previousReport==='function')?previousReport():'';\n      return canonicalSnapshot(stripNetwork(raw));\n    }catch(_e){return null;}\n  }\n};\n\nfunction sync(){\n  try{\n    window.KI21_RELEASE_AUTHORITY=RELEASE;\n    window.KI21_VERSION=RELEASE.full;\n    window.KI21_VERSION_SHORT=RELEASE.short;\n    if(typeof VERSION!=='undefined')VERSION=RELEASE.full;\n    if(window.portfolio)window.portfolio.version=RELEASE.full;\n    if(window.state)window.state.version=RELEASE.full;\n  }catch(_e){}\n  try{\n    document.title=RELEASE.full;\n    var h=document.getElementById('headerVersion'),f=document.getElementById('footerVersion');\n    if(h)h.textContent=RELEASE.short;\n    if(f)f.textContent=RELEASE.full;\n  }catch(_e){}\n}\nsync();\nwindow.addEventListener('pageshow',sync);\nwindow.addEventListener('focus',sync);\n\n})();\n<\/script>";
function patchSource(src){
  let out=String(src||'');
  if(!/KI21 Core 28\.0\.1/.test(out)) throw new Error('Bitte die KI21-Core-28.0.1-Datei auswählen.');
  if(/ki21-28-0-2-intelligence-single-source-of-truth/.test(out)) throw new Error('Diese Datei enthält 28.0.2 bereits.');
  out=out.replace(/28\.0\.1/g,'28.0.2');
  out=out.replace(/Intelligence State Binding Fix/g,'Intelligence Single Source of Truth');
  const at=out.lastIndexOf('</body>');
  if(at<0) throw new Error('Ungültige HTML-Datei: </body> fehlt.');
  out=out.slice(0,at)+'\n\n'+PATCH+'\n\n'+out.slice(at);
  return out;
}
document.getElementById('go').addEventListener('click',async()=>{

    const blob=new Blob([patched],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='KI21_Core_28.0.2_Intelligence_Single_Source_of_Truth.html';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
